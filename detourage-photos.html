<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Détourage de photos</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#5b6b7a;--acc:#0b5fc4;--line:#d5dce3}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--ink:#e8eef4;--mut:#93a3b3;--acc:#5aa2f5;--line:#2b3a48}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}
.s{color:var(--mut);margin:0 0 20px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
#drop{border:2px dashed var(--line);text-align:center;padding:36px 16px;cursor:pointer;color:var(--mut)}
#drop.over,#drop:focus-visible{border-color:var(--acc);outline:none;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=color]{padding:2px;height:40px;width:100%;cursor:pointer}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;padding:10px 18px;font-weight:600}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.it{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card)}
.it canvas{width:100%;height:auto;border-radius:6px;display:block;background:repeating-conic-gradient(#c9cfd6 0 25%,#fff 0 50%) 0 0/16px 16px}
.it input{width:100%;margin-top:8px}
.st{font-size:.8rem;color:var(--mut);margin-top:4px}
.rm{margin-top:6px;padding:4px 10px;background:var(--line);color:var(--ink);font-weight:400}
</style>
</head>
<body>
<main>
<h1>Détourage de photos</h1>
<p class="s">Supprime le fond, recadre autour du sujet, applique la couleur de ton choix et télécharge un zip de photos renommées. Tout se passe sur ton ordinateur.</p>

<div class="card" id="drop" tabindex="0">Dépose tes photos ici ou clique pour les choisir
<input id="file" type="file" accept="image/*" multiple hidden></div>

<div class="card opts">
<label>Couleur de fond<input type="color" id="color" value="#ffffff"></label>
<label>Type de fond<select id="transp"><option value="0">Couleur unie (JPG)</option><option value="1">Transparent (PNG)</option></select></label>
<label>Format<select id="ratio"><option value="1">Carré 1:1</option><option value="1.3333">Paysage 4:3</option><option value="0.75">Portrait 3:4</option><option value="0">Libre, ajusté au sujet</option></select></label>
<label>Taille du grand côté (px)<input type="number" id="size" value="1000" min="200" max="4000" step="100"></label>
<label>Marge autour du sujet (%)<input type="number" id="margin" value="8" min="0" max="40"></label>
<label>Préfixe des noms (facultatif)<input id="prefix" placeholder="ex. boutique"></label>
</div>

<div class="card"><button id="go" disabled>Télécharger le zip</button> <span id="msg" class="st"></span></div>
<div id="grid"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
const $ = id => document.getElementById(id);
const items = [];

function refreshBtn(){ $('go').disabled = !items.some(i => i.cut); }

function buildCard(it){
  const el = document.createElement('div'); el.className = 'it';
  it.cv = document.createElement('canvas'); it.cv.width = it.cv.height = 200;
  it.inp = document.createElement('input'); it.inp.value = it.name; it.inp.setAttribute('aria-label','Nom du fichier');
  it.st = document.createElement('div'); it.st.className = 'st'; it.st.textContent = 'En attente';
  const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = 'Retirer';
  rm.onclick = () => { items.splice(items.indexOf(it), 1); el.remove(); refreshBtn(); };
  el.append(it.cv, it.inp, it.st, rm); $('grid').append(el);
}

function bbox(bm){
  const w = bm.width, h = bm.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(bm, 0, 0);
  const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    if (d[(y * w + i) * 4 + 3] > 20) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  return x1 < x0 ? { x: 0, y: 0, w, h } : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function draw(it, cv, side){
  const r = +$('ratio').value, m = +$('margin').value / 100, b = it.bbox;
  const bw = b.w * (1 + 2 * m), bh = b.h * (1 + 2 * m);
  const ar = r || bw / bh;
  let cw = bw, ch = bh;
  if (cw / ch < ar) cw = ch * ar; else ch = cw / ar;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const W = ar >= 1 ? side : Math.round(side * ar), H = ar >= 1 ? Math.round(side / ar) : side;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  if ($('transp').value !== '1') { x.fillStyle = $('color').value; x.fillRect(0, 0, W, H); }
  x.imageSmoothingQuality = 'high';
  x.drawImage(it.cut, cx - cw / 2, cy - ch / 2, cw, ch, 0, 0, W, H);
}

async function cutout(it){
  it.busy = true; it.st.textContent = 'Détourage en cours…';
  try {
    const blob = await removeBackground(it.file, { output: { format: 'image/png' } });
    it.cut = await createImageBitmap(blob);
    it.bbox = bbox(it.cut);
    it.st.textContent = 'Prêt';
    draw(it, it.cv, 400);
  } catch (e) {
    it.st.textContent = 'Échec du détourage : ' + e.message;
    console.error(e);
  }
  it.busy = false; refreshBtn();
}

async function add(files){
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const it = { file: f, name: f.name.replace(/\.[^.]+$/, '') };
    buildCard(it); items.push(it);
  }
  for (const it of [...items]) if (!it.cut && !it.busy && !it.tried) { it.tried = true; await cutout(it); }
}

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
$('file').onchange = e => { add(e.target.files); e.target.value = ''; };

['color', 'transp', 'ratio', 'margin'].forEach(id => {
  $(id).oninput = () => items.forEach(i => i.cut && draw(i, i.cv, 400));
});

const clean = s => s.replace(/[\\/:*?"<>|]+/g, '-').trim();

$('go').onclick = async () => {
  const png = $('transp').value === '1', ext = png ? 'png' : 'jpg';
  const side = Math.min(4000, Math.max(200, +$('size').value || 1000));
  const pre = clean($('prefix').value);
  const ready = items.filter(i => i.cut), used = new Set(), zip = new JSZip();
  $('go').disabled = true;
  let n = 0;
  for (const it of ready) {
    const cv = document.createElement('canvas'); draw(it, cv, side);
    const blob = await new Promise(r => cv.toBlob(r, png ? 'image/png' : 'image/jpeg', .92));
    let base = clean(it.inp.value) || 'photo';
    if (pre) base = pre + '_' + base;
    let name = base, k = 2;
    while (used.has(name)) name = base + '_' + k++;
    used.add(name);
    zip.file(name + '.' + ext, blob);
    $('msg').textContent = ++n + ' / ' + ready.length + ' photos préparées';
  }
  const out = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out); a.download = 'photos-traitees.zip'; a.click();
  $('msg').textContent = 'Zip téléchargé (' + ready.length + ' photos)';
  refreshBtn();
};
</script>
</body>
</html>
